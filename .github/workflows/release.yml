name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Zip
        run: |
          zip -r themator.zip . -x "*.git*" "node_modules/*" ".github/*" "C:/*" "D:/*" "brain/*"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: themator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
